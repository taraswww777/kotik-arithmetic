<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#8BC34A"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>
  
  <!-- Котик -->
  <g transform="translate(100, 100)">
    <!-- Голова кота -->
    <circle cx="160" cy="130" r="40" fill="#fff"/>
    
    <!-- Уши -->
    <polygon points="280,110 295,80 315,110 305,105" fill="#e74c3c"/>
    <polygon points="265,110 280,80 295,110 285,105" fill="#e74c3c"/>
    <polygon points="220,110 235,80 250,110 240,105" fill="#e74c3c"/>
    
    <!-- Глаза -->
    <circle cx="140" cy="135" r="8" fill="#fff"/>
    <circle cx="280" cy="135" r="8" fill="#fff"/>
    <circle cx="140" cy="137" r="6" fill="#333"/>
    <circle cx="280" cy="137" r="6" fill="#333"/>
    
    <!-- Нос -->
    <polygon points="250,190 265,195 255,205 245,195" fill="#e74c3c"/>
    
    <!-- Рот -->
    <path d="M 250 205 L 255 215 M 250 205 L 245 215" stroke="#e74c3c" stroke-width="3" fill="none"/>
    
    <!-- Тело -->
    <rect x="140" y="260" width="180" height="150" rx="30" fill="#fff"/>
    
    <!-- Руки -->
    <path d="M 170 280 L 150 350 M 340 280 L 360 350" stroke="#e74c3c" stroke-width="15" fill="none"/>
    
    <!-- Лапы -->
    <ellipse cx="190" cy="380" rx="20" ry="15" fill="#fff"/>
    <ellipse cx="320" cy="380" rx="20" ry="15" fill="#fff"/>
    
    <!-- Текст "Котик" -->
    <text x="160" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333" text-anchor="middle">КОТИК</text>
  </g>
  
  <!-- Арифметика -->
  <circle cx="380" cy="90" r="45" fill="#fff" opacity="0.9"/>
  <text x="380" y="95" font-family="Arial, sans-serif" font-size="28" fill="#4CAF50" text-anchor="middle">+</text>
  
  <circle cx="160" cy="40" r="45" fill="#fff" opacity="0.9"/>
  <text x="160" y="45" font-family="Arial, sans-serif" font-size="28" fill="#4CAF50" text-anchor="middle">×</text>
</svg>