<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4CAF50" />
    <link rel="manifest" href="../manifest.json" />
    
    <!-- Скрытая панель для WebView -->
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
      }
      
      body {
        margin: 0;
        padding: 0;
        background-color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- Офлайн-плейсхолдер для WebView -->
    <div id="offline-placeholder" style="display:none;">
      <div style="text-align:center; padding:40px; background:#f5f5f5;">
        <div style="font-size:64px; margin-bottom:16px;">📱</div>
        <h2 style="margin:0 0 8px 0;">Нет интернета</h2>
        <p style="margin:0; font-size:16px;">Игра работает офлайн! Игра сохранена в кэше.</p>
      </div>
    </div>

    <!-- Корневой элемент приложения -->
    <div id="root"></div>
    
    <!-- PWA Service Worker -->
    <script type="module" src="../src/main.tsx"></script>
  </body>
</html>
